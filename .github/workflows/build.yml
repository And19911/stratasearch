name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты протокола
        run: ./gradlew --no-daemon :protocol:test

      - name: Сборка APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log

      # Ошибки компиляции — в аннотации, чтобы их было видно без скачивания логов.
      - name: Ошибки сборки
        if: failure()
        run: |
          grep -E "^e: |error:|Error:|What went wrong|lint|Lint" build.log | head -60 > errors.txt || true
          [ -f app/build/intermediates/lint_vital_intermediate_text_report/release/lintVitalReportRelease/lint-results-release.txt ] && head -60 app/build/intermediates/lint_vital_intermediate_text_report/release/lintVitalReportRelease/lint-results-release.txt >> errors.txt || true
          body=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Ошибки сборки::${body}"

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk "StrataSearch-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StrataSearch-APK-${{ github.run_number }}
          path: StrataSearch-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: protocol/build/reports/tests/

      # Готовый APK — на странице Releases, качается одной ссылкой с телефона.
      - name: Опубликовать релиз
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Поиск под завалом 1.0.${{ github.run_number }}
          body: |
            Сборка №${{ github.run_number }}. Скачайте APK ниже и установите на планшет
            (разрешите установку из неизвестных источников).
          files: StrataSearch-${{ github.run_number }}.apk
