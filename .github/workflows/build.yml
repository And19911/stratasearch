name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты протокола
        run: ./gradlew --no-daemon :protocol:test

      - name: Сборка APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk "StrataSearch-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StrataSearch-APK-${{ github.run_number }}
          path: StrataSearch-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: protocol/build/reports/tests/
